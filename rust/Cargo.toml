[package]
name = "backpressure-examples-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.12"
futures-util = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
debug = 1
